name: Tests and quality
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,mcp]'
      - name: Lint
        run: ruff check src tests
      - name: Check frontend syntax
        run: node --check src/processpilot/web/app.js
      - name: Test
        run: pytest -q
      - name: Routing quality gate
        run: python -m processpilot.evaluation tests/fixtures/evaluation.jsonl --min-category-accuracy 0.90 --min-priority-accuracy 0.90
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Verify packaged dashboard assets
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          required = {
              "processpilot/web/index.html",
              "processpilot/web/app.css",
              "processpilot/web/app.js",
          }
          with zipfile.ZipFile(wheel) as archive:
              missing = required.difference(archive.namelist())
          if missing:
              raise SystemExit(f"Missing wheel assets: {sorted(missing)}")
          PY

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t ai-process-pilot:ci .
      - name: Start container
        run: docker run -d --name processpilot-ci -p 127.0.0.1:18000:8000 ai-process-pilot:ci
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if docker inspect --format='{{json .State.Health.Status}}' processpilot-ci | grep -q healthy; then
              exit 0
            fi
            sleep 1
          done
          docker logs processpilot-ci
          docker inspect processpilot-ci
          exit 1
      - name: Smoke API
        run: curl --fail --silent http://127.0.0.1:18000/api/health
      - name: Cleanup
        if: always()
        run: docker rm -f processpilot-ci || true
