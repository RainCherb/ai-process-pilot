services:
  processpilot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PILOT_MODE: offline
      PILOT_DB: /data/processpilot.sqlite3
    volumes:
      - pilot-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
volumes:
  pilot-data:
